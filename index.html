<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PHENOMENA LAB</title>
<style>
  /* GitHub Pages の入口。作品を足したら下の WORKS に 1 行足す */
  body { margin: 0; background: #0B0B0A; color: #E8E6DF; font: 15px/1.7 "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 56px 28px 80px; }
  h1 { margin: 0; font: 400 40px/1.1 "Michroma", "Arial Black", sans-serif; letter-spacing: .14em; }
  .sub { margin-top: 14px; color: #A9A69D; }
  h2 { margin: 44px 0 12px; font: 600 12px/1 monospace; letter-spacing: .3em; color: #F2C27A; }
  .w { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 16px 0; border-top: 1px solid rgba(232,230,223,.14); }
  .w b { font-size: 18px; font-weight: 500; }
  .w p { margin: 2px 0 0; color: #A9A69D; font-size: 14px; grid-column: 1 / -1; }
  .w .l { display: flex; gap: 10px; align-self: start; }
  a { color: #0B0B0A; background: #E8A23A; text-decoration: none; padding: 5px 12px; font: 600 12px/1.4 monospace; letter-spacing: .08em; white-space: nowrap; }
  a.lp { background: transparent; color: #F2C27A; border: 1px solid #F2C27A; }
  footer { margin-top: 48px; color: #6B6357; font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>PHENOMENA LAB</h1>
  <div class="sub">自然現象・物理現象を触って、原因を見て、表現に持ち出すラボ。アプリと、その仕組みを読む解説スクロール LP の組。</div>
  <div id="works"></div>
  <footer>PC のブラウザ推奨（WebGL2）。画像：となりのトトロ © 1988 Hayao Miyazaki / Studio Ghibli（スタジオジブリ公式の場面写真）。</footer>
</main>
<script>
const WORKS = [
  ['WAVE', 'RELIGHT POSTER', 'ポスターカラーで描いた絵に、街灯・電球・夕日などの光を当てる。逆算・条件等色のペアも。', 'wave/relight_poster.html', 'wave/scroll/SCROLL_RELIGHT_LP.html'],
  ['WAVE', 'W1 ONE OCTAVE', '光を 1 オクターブの音に。黄色 1 本と、赤＋緑 2 本の違い。', 'wave/01_one_octave.html', 'wave/scroll/SCROLL_ONEOCTAVE_LP.html'],
  ['WAVE', 'W4 SKY', 'なぜ昼の空は青く、夕方は赤く、雲は白いのか。太陽の高さと粒の大きさで空を作る。', 'wave/04_sky.html', 'wave/scroll/SCROLL_SKY_LP.html'],
  ['WAVE', 'W6 RAINBOW', '虹はなぜ弧で、なぜいつも同じ大きさなのか。雨粒 1 つの光の道と分度器・霧の白い虹・過剰虹。', 'wave/06_rainbow.html', ''],
  ['WAVE', 'W6+ RAINBOW READER', '虹の写真 1 枚から、その日の雨粒の大きさを読む（W6 の逆向き）。見本の写真でクイズもできる。', 'wave/06_rainbow_reader.html', ''],
  ['EARTH', 'E1 PUSH & CARVE', '山はどうやって高くなり、なぜ無限には高くならないのか。', 'earth/01_push_and_carve.html', 'earth/scroll/SCROLL_PUSHCARVE_LP.html'],
  ['AIR', 'A1 CLOUD BASE', '雲はなぜそこに出来て、なぜ底が平らなのか。', 'air/01_cloud_base.html', 'air/scroll/SCROLL_CLOUDBASE_LP.html'],
  ['ZOOM', 'ZOOM CORE', '止まらない無限ズームのエンジン。', 'zoom/zoom_core.html', ''],
];
let html = '', last = '';
for (const [f, t, d, app, lp] of WORKS) {
  if (f !== last) { html += '<h2>' + f + '</h2>'; last = f; }
  html += '<div class="w"><b>' + t + '</b><span class="l"><a href="' + app + '">APP →</a>' + (lp ? '<a class="lp" href="' + lp + '">解説 LP →</a>' : '') + '</span><p>' + d + '</p></div>';
}
document.getElementById('works').innerHTML = html;
</script>
</body>
</html>
